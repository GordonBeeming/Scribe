name: PR Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'Scribe/**'
      - 'ScribeTests/**'
      - 'ScribeUITests/**'
      - 'ScribeWidget/**'
      - 'ScribeWatch/**'
      - 'ScribeWatchWidget/**'
      - 'project.yml'
      - '*.xcconfig'
      - '.github/workflows/pr-verification.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: xcode-27

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer

      - name: Show Xcode and SDK version
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for testing
        run: |
          xcodebuild clean build-for-testing \
            -project Scribe.xcodeproj \
            -scheme Scribe \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            -skipPackagePluginValidation \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO

      - name: Run unit tests (iPhone)
        run: |
          xcodebuild test-without-building \
            -project Scribe.xcodeproj \
            -scheme Scribe \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' \
            -only-testing:ScribeTests \
            -parallel-testing-enabled NO \
            -quiet

      - name: Run unit tests (iPad)
        run: |
          xcodebuild test-without-building \
            -project Scribe.xcodeproj \
            -scheme Scribe \
            -destination 'platform=iOS Simulator,name=iPad Air 13-inch (M4),OS=27.0' \
            -only-testing:ScribeTests \
            -parallel-testing-enabled NO \
            -quiet

      - name: Run unit tests (iPhone Duo)
        run: |
          xcodebuild test-without-building \
            -project Scribe.xcodeproj \
            -scheme Scribe \
            -destination 'platform=iOS Simulator,name=iPhone Duo,OS=27.1' \
            -only-testing:ScribeTests \
            -parallel-testing-enabled NO \
            -quiet

      - name: Verify navigation/forms and wide iPad insights
        run: |
          xcodebuild test-without-building \
            -project Scribe.xcodeproj \
            -scheme Scribe \
            -destination 'platform=iOS Simulator,name=iPad Air 13-inch (M4),OS=27.0' \
            -destination 'platform=iOS Simulator,name=iPhone Duo,OS=27.1' \
            -only-testing:ScribeUITests \
            -skip-testing:ScribeUITests/ScribeNavigationTests/testCaptureAppStoreScreenshots \
            -maximum-concurrent-test-simulator-destinations 1 \
            -parallel-testing-enabled NO \
            -quiet

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/*/Logs/Test/*.xcresult
          retention-days: 7
